# PrusaSlicer 2.9 configuration for stl/gyroid_3x3_40mm.stl
# Generic FFF printer, 0.4 mm nozzle, 1.75 mm PLA. Load with:
#   prusa-slicer --load prusaslicer_PLA_0.4mm_gyroid_3x3.ini --center 110,110 --export-gcode gyroid_3x3_40mm.stl
# Printer section is generic (220 x 220 bed, Marlin 2): replace it with your own printer
# profile and keep the print/filament values. Supports are OFF on purpose (see report).

# ---------------- printer (generic; replace with your printer) ----------------
printer_technology = FFF
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 220
nozzle_diameter = 0.4
gcode_flavor = marlin2
use_relative_e_distances = 1
retract_length = 0.8
retract_speed = 35
deretract_speed = 25
retract_lift = 0.2
retract_before_travel = 1.5
retract_layer_change = 1
wipe = 1
start_gcode = G90\nM83\nM140 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature]\nG28\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG92 E0
layer_gcode = G92 E0
end_gcode = M104 S0\nM140 S0\nM107\nG91\nG1 Z10 F600\nG90\nM84

# ---------------- filament: PLA ----------------
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.24
filament_max_volumetric_speed = 11
first_layer_temperature = 215
temperature = 210
first_layer_bed_temperature = 60
bed_temperature = 60
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
slowdown_below_layer_time = 8
min_print_speed = 15

# ---------------- print ----------------
layer_height = 0.2
first_layer_height = 0.2
perimeter_generator = arachne
perimeters = 3
extrusion_width = 0.45
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
first_layer_extrusion_width = 0.5
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4
fill_density = 100%
fill_pattern = rectilinear
top_solid_layers = 4
bottom_solid_layers = 3
external_perimeters_first = 0
# speeds (mm/s)
perimeter_speed = 40
external_perimeter_speed = 25
small_perimeter_speed = 20
infill_speed = 60
solid_infill_speed = 50
top_solid_infill_speed = 30
bridge_speed = 25
gap_fill_speed = 30
first_layer_speed = 20
travel_speed = 150
enable_dynamic_overhang_speeds = 1
# travel
avoid_crossing_perimeters = 1
only_retract_when_crossing_perimeters = 0
# adhesion
skirts = 1
skirt_distance = 6
# No brim: an outer brim follows the bottom face into the openings and fills them
# (measured in PrusaSlicer and Bambu Studio, see report section 6). The single continuous
# first layer adheres without it.
brim_type = no_brim
brim_width = 0
elefant_foot_compensation = 0.15
# geometry fidelity
xy_size_compensation = 0
resolution = 0
gcode_resolution = 0.0125
slice_closing_radius = 0.049
# supports: OFF (self-supporting; see report section on supports)
support_material = 0
support_material_auto = 1
support_material_threshold = 45
support_material_buildplate_only = 1
support_material_style = snug
support_material_contact_distance = 0.2
support_material_interface_layers = 2
support_material_spacing = 2.5
dont_support_bridges = 1
